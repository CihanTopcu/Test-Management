<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Kanıt. A check leaving its box through the open corner.

    On an indigo tile rather than the dark one: a favicon sits on whatever
    colour the browser's tab strip happens to be, and only a high-contrast
    tile is legible on both a light and a dark one.
  -->
  <rect width="24" height="24" rx="5.5" fill="#4F46E5"/>
  <g fill="none" stroke="#fff" stroke-width="2.1"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M15.2 6.4H8.8A2.4 2.4 0 0 0 6.4 8.8v6.4a2.4 2.4 0 0 0 2.4 2.4h6.4
             a2.4 2.4 0 0 0 2.4-2.4v-2"/>
    <path d="M9.4 12.1 11.4 14.1 17.9 7.4"/>
  </g>
</svg>
