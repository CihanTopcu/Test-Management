server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 30m;   # attachment uploads cap at 25 MB
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # the bundle is content-hashed, so it can be cached hard; index.html
    # must not be, or a deploy never reaches anybody's browser
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # CSV export of a large suite
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
